<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>.bg{fill:#f3f5f4}.side{fill:#173642}.nav{font:15px sans-serif;fill:#dce8e8}.brand{font:bold 24px sans-serif;fill:white}.h1{font:bold 28px sans-serif;fill:#173642}.sub{font:14px sans-serif;fill:#64737a}.card{fill:white;stroke:#dce3e4}.small{font:11px sans-serif;fill:#6c7d84}.title{font:bold 18px sans-serif;fill:#203942}.muted{font:12px sans-serif;fill:#728087}.metric{font:bold 30px sans-serif;fill:#1a5963}</style><rect width="1200" height="700" class="bg"/><rect width="270" height="700" class="side"/><text x="42" y="70" class="brand">ZH 知华科技</text><text x="42" y="105" class="nav">ESEARCH ENTERPRISE</text><text x="48" y="190" class="nav">知识数据源</text><text x="48" y="230" class="nav">内容采集</text><text x="48" y="270" class="nav">索引管理</text><text x="48" y="310" class="nav">权限同步</text><text x="48" y="350" class="nav">企业搜索</text><text x="48" y="390" class="nav">检索增强</text><text x="320" y="70" class="h1">企业知识搜索与检索增强平台 · 运营总览</text><text x="320" y="102" class="sub">在权限边界内统一检索企业知识，并返回可验证引用</text><g transform="translate(320,135)"><rect width="780" height="80" rx="12" class="card"/><text x="24" y="30" class="small">企业业务控制中心</text><text x="24" y="62" class="metric">模块 9 · 状态流转 · 风险 · SLA · 审计</text></g><g transform="translate(320,250)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">SOURCE</text><text x="20" y="70" class="title">知识数据源</text><text x="20" y="96" class="muted">连接文档库、业务系统、网页和数据</text></g><g transform="translate(590,250)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">INGESTION</text><text x="20" y="70" class="title">内容采集</text><text x="20" y="96" class="muted">解析、清洗、切分、去重和增量同步</text></g><g transform="translate(860,250)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">INDEX</text><text x="20" y="70" class="title">索引管理</text><text x="20" y="96" class="muted">管理全文、向量、字段和版本索引</text></g><g transform="translate(320,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">ACL</text><text x="20" y="70" class="title">权限同步</text><text x="20" y="96" class="muted">继承用户、组织、角色和文档访问范</text></g><g transform="translate(590,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">SEARCH</text><text x="20" y="70" class="title">企业搜索</text><text x="20" y="96" class="muted">提供关键词、语义、筛选和排序</text></g><g transform="translate(860,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">RAG</text><text x="20" y="70" class="title">检索增强</text><text x="20" y="96" class="muted">组织上下文、引用和可配置模型适配</text></g><text x="320" y="655" class="sub">界面示意 · 上海如静知华信息科技有限公司 · https://www.zhuatech.cn/</text></svg>